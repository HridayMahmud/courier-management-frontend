# Every push and pull request is linted, type-checked and built.
# A push to main that passes is deployed to Vercel production (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets).
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://courier-management-backend-o9qw.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Vercel production
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN secret is not set"; exit 1; fi
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
